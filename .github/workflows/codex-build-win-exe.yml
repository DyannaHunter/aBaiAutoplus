name: Codex Windows EXE Build

on:
  push:
    branches:
      - codex/build-win-v1.0.0
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.0
  RELEASE_TAG: v1.0.0
  RELEASE_TARGET_SHA: 3f428f02b55e72f7e2a33e186c8856975098d826

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build frontend
        run: npm ci --legacy-peer-deps && npm run build
        working-directory: frontend

      - name: Inject version
        shell: pwsh
        run: |
          "__version__ = `"$env:APP_VERSION`"" | Out-File -FilePath core/version.py -Encoding utf8
          npm version --no-git-tag-version --allow-same-version $env:APP_VERSION
        working-directory: electron

      - name: Prepare Electron builder config
        shell: pwsh
        run: |
          $config = Get-Content electron/electron-builder.yml
          $config = $config | Where-Object { $_ -notmatch '^\s*icon:\s*build/' }
          $config | Set-Content electron/electron-builder.yml -Encoding utf8

      - name: Build Python backend
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            '--onedir',
            '--name', 'backend',
            '--add-data', 'platforms;platforms',
            '--add-data', 'providers;providers',
            '--add-data', 'core;core',
            '--add-data', 'api;api',
            '--add-data', 'application;application',
            '--add-data', 'domain;domain',
            '--add-data', 'infrastructure;infrastructure',
            '--add-data', 'services;services',
            '--collect-submodules', 'platforms',
            '--collect-submodules', 'providers',
            '--collect-submodules', 'api',
            '--collect-submodules', 'application',
            '--collect-submodules', 'domain',
            '--collect-submodules', 'infrastructure',
            '--collect-submodules', 'core',
            '--collect-submodules', 'services',
            '--collect-all', 'browserforge',
            '--collect-all', 'camoufox',
            '--collect-all', 'apify_fingerprint_datapoints',
            '--collect-all', 'language_tags',
            '--collect-all', 'ua_parser',
            '--collect-all', 'ua_parser_builtins',
            '--collect-all', 'quart',
            '--collect-all', 'hypercorn',
            '--collect-all', 'aiofiles'
          )
          if (Test-Path static) {
            $pyinstallerArgs += @('--add-data', 'static;static')
          }
          pyinstaller @pyinstallerArgs main.py
          New-Item -ItemType Directory -Force -Path electron/backend | Out-Null
          Copy-Item -Recurse dist/backend electron/backend/

      - name: Build Electron Windows installer
        run: npm ci --legacy-peer-deps && npx electron-builder --win --publish never
        working-directory: electron
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aBaiAutoplus-win-exe-${{ env.APP_VERSION }}
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Create release tag if needed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = `refs/tags/${process.env.RELEASE_TAG}`;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${process.env.RELEASE_TAG}` });
              core.info(`${ref} already exists`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref, sha: process.env.RELEASE_TARGET_SHA });
              core.info(`Created ${ref} at ${process.env.RELEASE_TARGET_SHA}`);
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_TARGET_SHA }}
          name: aBaiAutoplus ${{ env.RELEASE_TAG }}
          body: Windows exe built remotely by GitHub Actions.
          files: electron/dist/*.exe
          fail_on_unmatched_files: true
          make_latest: true
